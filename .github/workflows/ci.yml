name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Mocked tests: CPU-only torch and no Triton, which also proves they
  # never need a GPU.
  unit:
    name: Unit tests (mocked, py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy requests matplotlib pytest
      - name: Run mocked tests
        run: python -m pytest -m "not kernel and not gpu" -rxXs
      - name: Tests must not modify the working tree
        run: git status --porcelain && test -z "$(git status --porcelain)"

  # Real generated Triton kernels, run on the CPU by Triton's interpreter
  # and checked against PyTorch. Checks correctness, not speed; benchmarks
  # (marked `gpu`) need a real GPU and are run locally.
  kernels:
    name: Kernel tests (Triton interpreter, CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRITON_INTERPRET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install CPU-only dependencies with Triton
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install triton numpy requests matplotlib pytest
      - name: Run kernel tests on CPU
        run: python -m pytest -m kernel -rxXs
      - name: Tests must not modify the working tree
        run: git status --porcelain && test -z "$(git status --porcelain)"
